name: Build and upload Mewsaic Nook

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional numeric build number (defaults to this workflow run number)'
        required: false
        type: string
      upload:
        description: 'Upload the signed IPA to App Store Connect'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mewsaic-app-store
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BUNDLE_ID: com.mewsaic.erden.nook.app
      MARKETING_VERSION: 1.0.0
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify toolchain and build number
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]] || { echo 'Build number must be an integer from 1 to 9999.'; exit 1; }
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ "${sdk%%.*}" -ge 26 ]] || { echo 'App Store uploads require iOS SDK 26 or newer.'; exit 1; }

      - name: Validate bundled puzzles
        run: |
          set -euo pipefail
          python3 tools/levelgen/check_frames.py
          bash tools/kerneltest/campaign.sh
          bash tools/kerneltest/daily.sh
          bash tools/kerneltest/volley.sh

      - name: Install signing material in a temporary keychain
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ci/install-signing.sh

      - name: Archive and export the signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ci/archive.sh

      - name: Retain IPA and symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MewsaicNook-1.0.0-${{ env.BUILD_NUMBER }}
          path: |
            artifacts/export/*.ipa
            artifacts/MewsaicNook.xcarchive/dSYMs/
            artifacts/build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA and wait for Apple processing
        if: ${{ inputs.upload }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_PROVIDER_ID: ${{ secrets.ASC_PROVIDER_ID }}
        run: bash ci/upload.sh

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          if [[ -n "${INSTALLED_PROFILE:-}" ]]; then rm -f "$INSTALLED_PROFILE"; fi
          if [[ -n "${SIGNING_DIR:-}" && "$SIGNING_DIR" == "$RUNNER_TEMP"/mewsaic-signing-* ]]; then
            rm -rf "$SIGNING_DIR"
          fi
